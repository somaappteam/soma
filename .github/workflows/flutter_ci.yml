name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check localization parity
        run: dart run tool/check_l10n.dart

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Enforce minimum coverage (20%)
        run: |
          dart run tool/check_coverage.dart coverage/lcov.info 20
